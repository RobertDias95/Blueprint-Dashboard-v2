<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- fix-313 #64 replaced Vite's purple lightning bolt with a PLACEHOLDER
         mark, because Bobby's artwork did not exist yet. fix-322 shipped the
         real artwork in the ribbon and deliberately LEFT the placeholder here,
         reasoning that a detailed illustration is a smudge at 16px.

         ★ fix-325 REVERSES the second half of that. Bobby, seeing it in use:
         "the tab has the old logo as well." The reasoning that survives is only
         about the WIDE illustration — the square arch crop of his real artwork
         holds at 16px and 32px (rendered and checked, not assumed), so the tab
         now carries his mark instead of my drawing.

         ★ fix-326 replaced the crop with the brand sheet's OWN icon. fix-325
         used a square crop of the detailed illustration and I noted it sat
         small; the crop was never the fix — the illustration is a thin line
         drawing, so at 16px it is a few grey pixels however it is cropped.
         Bobby's brand sheet carries a purpose-drawn "ICON (SIMPLIFIED)": a solid
         blue tile with a bold white bridge, which is a SHAPE at 16px rather than
         a picture that has been shrunk. Verified in a rendered tab strip.

         ★ ONE DECLARATION, PLUS A SIZE HINT. Two <link>s to two RENDERINGS OF
         THE SAME MARK is not the fix-325 trap — that was a second link to a
         DIFFERENT (placeholder) mark, which let a browser show the wrong logo.
         Here 32 is the hand-tuned small size and 256 covers everything larger;
         whichever a browser picks, it picks the right artwork.

         ★★★ fix-351 points both at the 2026 artwork. The RULE is unchanged and
         is the reason the files are named the way they are: the tab gets the
         SQUARE crop, never the lockup. The lockup is 5.72:1 — in a 32px square
         it is an illegible smear, and letterboxed it is about 6px tall. The
         square is the bridge and its road, cropped from above the word and
         above the two rules, both of which turn to noise below ~32px.

         ★ These are the copies in public/, referenced by a STABLE path because
         index.html and every bookmarked tab load them directly. The same two
         files also exist in src/assets/brand/ so Vite fingerprints the in-app
         copies. fix-326 asserts that split; fix-351 keeps it. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/bridge-favicon-2026-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/bridge-icon-2026-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blueprint Bridge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
